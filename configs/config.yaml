# Configuración de oil-rnn. Cada run guarda una copia exacta en runs/<run_id>/config.yaml.
#
# Tres tipos de valor:
#   PENDIENTE    decisión del proyecto aún no tomada. El comando que la necesita se para.
#   PROVISIONAL  valor de partida para una prueba de humo; funciona, pero no está decidido.
#   (sin marca)  fijo: regla de la plantilla o dato ya decidido.
# `make pending` lista los dos primeros.
# Probar un valor sin editar este archivo:  make train NAME=prueba ARGS="--set seed=7"

seed: 42
task: regression
data_kind: time_series

data:
  source:
    type: code
    filename: dataset.csv
    start: "2000-01-01"
    end: "2026-11-11"
    calendar: brent
    fred:
      brent: DCOILBRENTEU        # EIA, Brent spot
      wti: DCOILWTICO            # EIA, WTI spot
      henry_hub: DHHNGSP         # EIA, gas natural Henry Hub
      ecb_deposit_rate: ECBDFR   # BCE, facilidad de depósito
      usd_per_eur: DEXUSEU
      cny_per_usd: DEXCHUS
      vix: VIXCLS                # volatilidad implícita del S&P 500
    yahoo_ohlcv:
      brent_fut: BZ=F            # futuro Brent (datos desde ~2007)
      wti_fut: CL=F              # futuro WTI
    yahoo_close:                 # columna: ticker → solo el cierre
      copper: HG=F
      gold: GC=F
      dollar_index: DX-Y.NYB

  # ── Lectura y splits: make prepare ──────────────────────
  na_values: []
  target: brent
  features: [brent, wti, henry_hub, ecb_deposit_rate, usd_per_eur, cny_per_usd, vix, wti_fut_open, wti_fut_high, wti_fut_low, wti_fut_close, wti_fut_volume, copper, gold, dollar_index]
  time_column: date              # columna de fecha; los datos se ordenan por ella
  fill_missing: ffill            # PROVISIONAL · ffill = repetir el último valor conocido · null = no rellenar
  window: 60                     # PROVISIONAL · pasos de historia que ve la red; 60 frente a 120 se decide en validación
  horizon: 5                     # días hábiles por delante. Un modelo por horizonte: 5, 21, 63 y 252 (--set data.horizon=N)
  inputs:                        # cómo entra cada feature en la red (antes de estandarizar)
    transform: returns           # returns = cambio diario, log(x[t]/x[t-1]) salvo las listas de abajo · level = el valor
    diff: [ecb_deposit_rate]     # x[t] - x[t-1]: admite valores <= 0
    log1p_diff: [wti_fut_volume] # log(1+x[t]) - log(1+x[t-1]): volúmenes con ceros
    floor: {wti: 1.0, wti_fut_open: 1.0, wti_fut_high: 1.0, wti_fut_low: 1.0, wti_fut_close: 1.0}  # $/barril mínimo: WTI negativo del 20/04/2020
    volatility: 21               # añade la desviación típica móvil de 21 días del rendimiento del target · null = no
    clip: 5                      # recorta las entradas estandarizadas a ±5 desviaciones (el WTI de abril de 2020 llega a ~120) · null = no
  target_mode: log_return        # log_return = log(valor / último conocido) · change = diferencia · level = el valor
  val_size: 0.15                 # proporción para validación
  test_size: 0.15                # proporción para test (≈ últimos 3,8 años: 3–4 pronósticos independientes a 252 días)

model:
  quantiles: [0.1, 0.5, 0.9]     # salidas de la red, pérdida pinball; 0.5 = predicción puntual, 0.1–0.9 = intervalo del 80 % · null = un valor con MSE
  cell: lstm                     # PROVISIONAL · rnn | lstm | gru
  hidden_size: 64                # PROVISIONAL
  num_layers: 2                  # PROVISIONAL
  dropout: 0.1                   # PROVISIONAL

train:
  epochs: 60
  batch_size: 64                 # PROVISIONAL
  learning_rate: 0.001           # PROVISIONAL · se elige en la rejilla (sweep)
  patience: 10                   # early stopping sobre la pérdida de validación
  min_epochs: 10                 # no se para antes de esta época

cv:                              # validación walk-forward sobre train + val (make cv); test queda fuera
  folds: 4                       # bloques de evaluación consecutivos que terminan al final de val
  block: 504                     # filas por bloque (≈ 2 años: 2 pronósticos independientes a 252 días)
  holdout: 252                   # últimas filas de cada entrenamiento para early stopping (≈ 1 año); purga = data.horizon
  naive_futures:                 # referencia «ingenuo con futuros» en los bloques (make naive-futures): P[t]·F[t+L]/F[t]
    column: brent_fut_close      # futuro con el que se actualiza el último spot publicado
    lags: [1, 2, 3, 5, 7]        # retrasos de publicación probados, en días hábiles; se limitan a h

sweep:                           # comparativa de la fase 3 (make sweep · make compare): un make cv por combinación
  prefix: g1                     # va al principio del nombre de cada run; otro prefijo = otra rejilla
  cells: [rnn, lstm, gru]
  horizons: [5, 21, 63, 252]
  hidden_size: [32, 64, 128, 256]
  depth: [[1, 0.0], [2, 0.0], [2, 0.3]]   # [num_layers, dropout]: con 1 capa PyTorch no aplica dropout
  learning_rate: [0.001, 0.0003, 0.0001]
  select_by: pinball             # métrica cv_<select_by> (media de pliegues) que elige la mejor; menor = mejor

web:                             # make export-web: modelo de cada horizonte (decisión de la fase 4, docs/PLAN.md)
  models:
    5: 20261112-125213_final-gru-h5_omen-pc
    21: 20261112-125257_final-lstm-h21_omen-pc
    63: 20261112-125335_final-gru-h63_omen-pc
    252: 20261112-125438_final-rnn-h252_omen-pc
  # Sucesos del ciclo económico que marca el histórico: fecha y precio salen de los datos (máximo
  # o mínimo del tramo); las causas son las que da el enunciado (docs/assignment), sin otras fuentes.
  events:
    - {start: "2008-01-01", end: "2008-12-31", kind: max, label: "Máximo de 2008",
       text: "Máximo de toda la serie, al final de la expansión previa a la crisis financiera."}
    - {start: "2008-07-01", end: "2009-06-30", kind: min, label: "Crisis financiera",
       text: "Desplome posterior por la crisis financiera, que llevó a la economía mundial a una recesión."}
    - {start: "2015-01-01", end: "2016-12-31", kind: min, label: "Exceso de oferta",
       text: "Final de la caída de 2014–2016, provocada por un exceso de oferta de crudo."}
    - {start: "2020-01-01", end: "2020-12-31", kind: min, label: "Pandemia",
       text: "Desplome por la pandemia, que frenó la actividad y la demanda mundiales."}
    - {start: "2022-01-01", end: "2022-12-31", kind: max, label: "Invasión de Ucrania",
       text: "Subida tras la invasión de Ucrania."}
    - {start: "2026-01-01", end: "2026-12-31", kind: max, label: "Subida de 2026",
       text: "Movimiento más reciente de la serie. Su causa no se documenta en este proyecto."}

mlflow:
  experiment: oil-rnn
  tracking_uri: local            # local = runs/mlflow.db · o http://servidor:5000
  log_models: true
