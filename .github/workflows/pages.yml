# Publica web/ en GitHub Pages en cada push a main que toque web/.
# Los modelos no están en git: se descargan de la Release indicada en web/public/model/manifest.json
# y se comprueba el SHA-256 de cada uno antes de compilar.
# Activar una vez: Settings → Pages → Source: GitHub Actions.
name: Publicar web

on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Descargar y verificar los modelos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(node -p "require('./public/model/manifest.json').release")
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern "*.onnx" --dir public/model --clobber
          node -e "require('./public/model/manifest.json').models.forEach(m => console.log(m.sha256 + '  public/model/' + m.model_file))" | sha256sum --check
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
