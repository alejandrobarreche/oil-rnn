<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Brent: previsión del precio</title>
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Geist:wght@300..700&display=swap" rel="stylesheet" />
    <script>
      // Tema antes de pintar: el guardado o el del sistema
      try {
        var t = localStorage.getItem("brent-theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <header class="bar">
      <a class="brand" href="./" aria-label="Brent, inicio"><span class="mark">BRENT<i>.</i></span></a>
      <span class="grow"></span>
      <a class="btn btn-ghost" id="study" href="./brent/index.html"></a>
      <button class="btn btn-icon" id="theme" type="button" aria-label="Cambiar entre tema claro y oscuro"></button>
    </header>

    <main class="app">
      <section class="stage" id="stage" aria-label="Precio del Brent y previsión"></section>

      <section class="panel" id="panel">
        <h1 class="title">Previsión del Brent</h1>

        <div class="seg seg-h" id="horizon" role="radiogroup" aria-label="Plazo"></div>
        <div class="seg seg-m" id="mode" role="radiogroup" aria-label="Desde cuándo"></div>
        <div class="scrub" id="scrub" hidden></div>

        <div class="result" id="result" aria-live="polite"></div>

        <div class="actions" id="actions"></div>
        <a class="verdict" id="verdict" href="./brent/index.html"></a>
      </section>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
