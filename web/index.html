<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mesa de compras del Brent</title>
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Geist:wght@300..700&display=swap" rel="stylesheet" />
    <script>
      // Tema antes de pintar: el guardado o el del sistema
      try {
        var t = localStorage.getItem("brent-theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <a class="logo" href="./" aria-label="Brent, inicio">BRENT<span>.</span></a>
        <span class="spacer"></span>
        <span class="ticker num" id="ticker"></span>
        <div class="segbox" role="group" aria-label="Modo">
          <div class="seg-ind" id="segInd" aria-hidden="true"></div>
          <button type="button" class="seg on" id="segHoy" aria-pressed="true">Hoy</button>
          <button type="button" class="seg" id="segPas" aria-pressed="false">En el pasado</button>
        </div>
        <a class="howlink" href="./brent/index.html">Cómo se hizo</a>
        <button type="button" class="themebtn" id="theme" aria-label="Cambiar entre tema claro y oscuro"></button>
      </header>

      <h1 class="a-rise" id="headline">Mesa de compras del Brent</h1>

      <div class="desk">
        <section class="main" aria-label="Pasos de la compra">
          <nav class="steps" aria-label="Pasos">
            <div class="stepbtns" id="stepBtns"></div>
            <div class="bar"><div class="prog" id="prog"></div></div>
          </nav>
          <div class="stage" id="stage"></div>
        </section>

        <aside class="side" aria-label="Orden de compra">
          <div class="ticket-wrap a-print">
            <div class="ticket" id="ticket">
              <div class="tk-head">
                <span class="tk-title">Orden de compra</span>
                <span class="tk-no num" id="orderNo">Nº —</span>
              </div>
              <div class="tk-rule"></div>
              <dl id="lines"></dl>
              <div class="tk-total" aria-live="polite">
                <span class="tk-tlabel" id="totalLabel">Total</span>
                <span class="tk-tval num empty hatch" id="totalVal"></span>
              </div>
            </div>
          </div>
        </aside>
      </div>

      <footer class="foot">
        <p id="verdict"></p>
        <a href="./brent/index.html">Ver cómo se hizo</a>
      </footer>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
