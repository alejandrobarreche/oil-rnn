<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sonda · Brent</title>
    <link rel="icon" href="data:," />
  </head>
  <body class="bx-page">
    <div class="bx-ws">
      <header class="bx-top">
        <a class="home" href="#/mercado" aria-label="Mercado">
          <span id="logo"></span>
          <span class="title"><h1>Brent</h1><span class="bx-muted">Spot · $/bbl</span></span>
        </a>
        <span class="bx-spacer"></span>
        <span class="bx-pill bx-pill-solid asof" id="asof"></span>
        <a class="wallet" id="wallet" href="#/cartera" title="Mi cartera" aria-label="Mi cartera"></a>
        <span id="theme"></span>
      </header>

      <p id="loading" class="loading">Calculando las predicciones en el navegador…</p>

      <main class="view" data-view="mercado">
        <div class="bx-ws-main">
          <section class="bx-card chart-card">
            <div class="chart-h"><div id="ph"></div><nav id="tabs" class="hz" aria-label="Horizonte de la previsión"></nav></div>
            <div id="chart"></div>
          </section>
          <aside class="side">
            <section class="bx-card bx-ws-panel" id="panel"></section>
            <section class="bx-card mini" id="mini"></section>
          </aside>
        </div>
        <div class="ch section-h">
          <div><div class="ch-t">Todos los horizontes</div><div class="ch-s">Pulsa uno para verlo en el gráfico</div></div>
          <div class="legend"><span><i class="lg-last"></i>Precio hoy</span><span><i class="lg-mid"></i>Previsto</span><span><i class="lg-band"></i>Rango probable (80 %)</span></div>
        </div>
        <div id="cards"></div>
        <div class="bx-ws-pair">
          <section class="bx-card">
            <div class="ch"><div><div class="ch-t">Fiabilidad de los modelos</div><div class="ch-s" id="perf-s"></div></div></div>
            <div id="metrics"></div>
            <div class="bt-h" id="bt-t"></div>
            <div id="bt"></div>
          </section>
          <section class="bx-card">
            <div class="ch"><div><div class="ch-t" id="drv-t">Qué mira el modelo</div><div class="ch-s">Cuánto cambiaría la previsión, en $ por barril, si el modelo no viera cada dato</div></div></div>
            <div id="drv"></div>
          </section>
        </div>
      </main>
      <main class="view" data-view="cartera" id="view-cartera" hidden></main>
      <main class="view" data-view="calculadora" id="view-calculadora" hidden></main>
      <main class="view" data-view="historial" id="view-historial" hidden></main>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
