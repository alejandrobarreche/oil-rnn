<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>El Brent a cuatro plazos</title>
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Geist:wght@300..700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <a class="logo" href="./" aria-label="Brent, inicio">BRENT<span>.</span></a>
        <nav class="tabs" aria-label="Secciones">
          <a class="tab on" href="./" aria-current="page">Previsión</a>
          <a class="tab study" href="./brent/index.html">Cómo se hizo</a>
        </nav>
        <span class="spacer"></span>
        <span class="live num" id="live"></span>
      </header>

      <main class="main">
        <section class="chartcard" aria-label="Precio del Brent y previsión">
          <div class="tools" role="toolbar" aria-label="Opciones del gráfico">
            <div class="seg" id="range" role="group" aria-label="Historia visible"></div>
            <div class="seg" id="scale" role="group" aria-label="Escala">
              <button type="button" data-scale="lin" aria-pressed="true">Lineal</button>
              <button type="button" data-scale="log" aria-pressed="false">Log</button>
            </div>
            <button type="button" class="tog" data-tog="ma50" aria-pressed="false"><i class="sw ma50"></i>Media 50</button>
            <button type="button" class="tog" data-tog="ma200" aria-pressed="false"><i class="sw ma200"></i>Media 200</button>
            <button type="button" class="tog" data-tog="events" aria-pressed="false">Sucesos</button>
            <button type="button" class="tog" data-tog="test" aria-pressed="false"><i class="sw test"></i>Previsión en test</button>
          </div>
          <div class="chart" id="chart"></div>
        </section>

        <aside class="panel" aria-labelledby="title">
          <h1 id="title">El Brent a cuatro plazos</h1>
          <p class="lead" id="lead">Cuatro redes recurrentes, una por plazo, leen los últimos días del mercado y dan la franja donde caerá el precio en 8 de cada 10 casos.</p>
          <div class="intro" id="intro">
            <button type="button" class="btn primary" id="run">Prever con las 4 redes</button>
          </div>
          <div class="detail" id="detail" hidden></div>
          <div class="drop" id="drop"></div>
        </aside>
      </main>

      <footer class="foot">
        <span id="source"></span>
        <span>Aprendizaje Automático, caso 2</span>
      </footer>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
